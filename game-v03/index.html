<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sangre de Luna — Ecos de la Ciudadela v0.3</title>
<style>
html,body{margin:0;min-height:100%;background:#03070d;color:#dfe6ea;font-family:Inter,system-ui,Segoe UI,sans-serif}body{display:grid;place-items:center}.boot{width:min(560px,88vw);text-align:center}.crest{width:150px;max-width:40vw;filter:drop-shadow(0 12px 32px #0008)}h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(28px,6vw,52px);margin:16px 0 8px}p{color:#aeb9c0;line-height:1.55}.bar{height:4px;background:#18212a;border-radius:999px;overflow:hidden;margin:24px auto;width:min(360px,80vw)}.bar:after{content:"";display:block;height:100%;width:38%;background:#b99a61;animation:load 1.1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(165%)}}.error{display:none;border:1px solid #5e3434;background:#201214;padding:16px;border-radius:14px;margin-top:18px;color:#ffd7d7}</style>
</head>
<body>
<main class="boot">
<img id="crest" class="crest" alt="Sangre de Luna">
<h1>Ecos de la Ciudadela</h1>
<p>Cargando la versión 3D v0.3…</p>
<div class="bar" aria-label="Cargando"></div>
<div id="err" class="error"></div>
</main>
<script type="module">
const err=document.getElementById('err');
const GH_ROOT='https://raw.githack.com/sangredelunaia-code/Sangre-de-Luna-Web/game-aaa-prototype/';
const onGitHack=location.hostname.includes('githack.com');
const assetBase=onGitHack?GH_ROOT+'assets/':'/assets/';
document.getElementById('crest').src=assetBase+'logo.webp';
try{
  if(!('DecompressionStream' in window)) throw new Error('Tu navegador necesita una versión reciente de Chrome o Edge.');
  const r=await fetch('./payload.b64',{cache:'no-store'});
  if(!r.ok) throw new Error('No se pudo cargar el paquete del juego.');
  const b64=(await r.text()).trim();
  const raw=atob(b64); const bytes=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
  const ds=new DecompressionStream('gzip');
  const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
  const fixed=html.replaceAll('../assets/',assetBase);
  const blob=new Blob([fixed],{type:'text/html'});
  location.replace(URL.createObjectURL(blob));
}catch(e){
  err.style.display='block';err.textContent='No se pudo iniciar el juego: '+(e?.message||e);
}
</script>
</body>
</html>
