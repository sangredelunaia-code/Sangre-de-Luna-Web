name: One-time mobile responsive game patch

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/one-time-mobile-responsive-game.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add automatic responsive layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('game-runtime/live-loader.js')
          s = p.read_text(encoding='utf-8')
          marker = 'sdl-auto-responsive-v2'
          if marker not in s:
              responsive = r'''  const responsiveCss=`
  /* sdl-auto-responsive-v2 */
  :root{--sdl-vh:100dvh}html,body{max-width:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}body{padding:0!important}img{max-width:100%}button,.btn,.choice,.card,.mission{touch-action:manipulation;-webkit-tap-highlight-color:transparent}.btn,.choice,.s0ans button,.s0end,.s0go{user-select:none}
  @supports(height:100svh){:root{--sdl-vh:100svh}}
  @media(pointer:coarse){button,.btn,.choice,.s0ans button,.s0end,.s0go{min-height:42px}.card:hover{transform:none!important}}
  @media(max-width:820px) and (orientation:portrait){
    html,body{width:100%!important;min-height:100%!important;overflow-x:hidden!important;overflow-y:auto!important;background:#05080d!important}
    .screen{width:100%!important;height:auto!important;min-height:var(--sdl-vh)!important;overflow:visible!important}
    .top{height:auto!important;min-height:50px!important;position:sticky!important;top:0!important;z-index:60!important;padding:calc(6px + env(safe-area-inset-top)) 8px 6px!important;gap:6px!important;background:#05090ef7!important;backdrop-filter:blur(12px)}
    .top .brand{gap:6px!important;min-width:0}.top .brand img{width:30px!important;flex:0 0 30px}.top .brand .ey{display:none!important}.top .brand b,.top .brand strong{font-size:11px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top .actions{gap:4px!important;flex-wrap:nowrap!important}.top .actions .btn{padding:6px 8px!important;font-size:9px!important;min-height:34px!important}.top>div:last-child{font-size:10px!important;white-space:nowrap!important}
    .hero{width:100%!important;height:auto!important;min-height:var(--sdl-vh)!important;grid-template-columns:1fr!important;align-content:center!important;justify-items:center!important;text-align:center!important;gap:16px!important;padding:calc(22px + env(safe-area-inset-top)) 18px calc(22px + env(safe-area-inset-bottom))!important}.hero>div{min-width:0!important}.hero h1{font-size:clamp(36px,12vw,58px)!important;line-height:.92!important}.hero .lead{font-size:13px!important;line-height:1.5!important}.hero .actions{justify-content:center!important}.cardHero{width:min(230px,62vw)!important;height:auto!important;max-width:none!important}
    .campaign{width:100%!important;height:auto!important;min-height:calc(var(--sdl-vh) - 50px)!important;display:grid!important;grid-template-columns:1fr!important;grid-template-rows:auto minmax(54vh,1fr)!important;gap:8px!important;margin:0!important;padding:8px 8px calc(14px + env(safe-area-inset-bottom))!important;overflow:visible!important}.side{height:auto!important;max-height:none!important;padding:10px!important;display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;grid-template-areas:'ey stat' 'title stat' 'lead lead'!important;gap:2px 8px!important;overflow:visible!important}.side>.ey{grid-area:ey}.side h2{grid-area:title;font-size:20px!important;margin:1px 0!important}.side .lead{grid-area:lead;font-size:10px!important;line-height:1.35!important;margin:3px 0!important}.side .stat{grid-area:stat;justify-content:flex-end!important;align-content:center!important}.stat span{padding:4px 6px!important;font-size:9px!important}.campaign>div:last-child{display:grid!important;grid-template-rows:minmax(54vh,1fr) auto auto!important;gap:7px!important;min-height:0!important}.mission{height:auto!important;min-height:54vh!important;max-height:none!important}.mcopy{left:13px!important;right:13px!important;bottom:13px!important}.mcopy b{font-size:26px!important}.mcopy p{font-size:11px!important;line-height:1.4!important}.next{padding:8px!important;font-size:10px!important}.campaign .actions{margin:0!important;display:grid!important;grid-template-columns:1fr 1fr!important}.campaign .actions .btn{width:100%!important;min-width:0!important}
    #game{height:auto!important;min-height:var(--sdl-vh)!important;overflow:visible!important}.game,#game>.game{width:100%!important;height:auto!important;min-height:calc(var(--sdl-vh) - 50px)!important;display:block!important;overflow:visible!important;margin:0!important;padding:6px 6px calc(18px + env(safe-area-inset-bottom))!important}.guide{position:sticky!important;top:50px!important;z-index:45!important;width:100%!important;height:auto!important;min-height:50px!important;margin:0 0 6px!important;padding:7px 9px!important;overflow:hidden!important;background:#0b1420f5!important;backdrop-filter:blur(10px)}.step{width:34px!important;height:34px!important;flex:0 0 34px!important;font-size:12px!important}.guide b{font-size:14px!important}.guide p{font-size:9.5px!important;white-space:normal!important;line-height:1.25!important;margin:2px 0!important}
    .board{width:100%!important;height:auto!important;min-height:0!important;display:grid!important;grid-template-columns:1fr!important;grid-template-rows:auto!important;gap:7px!important;overflow:visible!important}.board>div:first-child,.board>div:nth-child(2),.board>div:last-child{grid-column:1!important;grid-row:auto!important;width:100%!important;height:auto!important;min-height:0!important;overflow:visible!important}.board>div:nth-child(2){display:grid!important;grid-template-rows:auto auto auto!important;gap:7px!important}.board>div:last-child{display:flex!important;flex-direction:column!important}.panel,.board>.panel,.board>div:nth-child(2)>.panel{height:auto!important;min-height:0!important;max-height:none!important;overflow:visible!important;padding:9px!important;border-radius:13px!important}.art{height:105px!important}.panel h3{font-size:15px!important;margin:5px 0!important}.goals{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:5px!important}.goal{padding:6px 7px!important;font-size:10px!important}.threat{padding:6px 7px!important;font-size:10px!important}.event{height:auto!important;min-height:118px!important;max-height:none!important;grid-template-columns:96px minmax(0,1fr)!important}.event div{padding:8px!important}.event b{font-size:18px!important}.event p{display:block!important;font-size:10px!important;line-height:1.3!important}.choices{gap:6px!important}.choice{padding:9px!important;font-size:10px!important;line-height:1.3!important}.choice div{font-size:9px!important}.play{height:auto!important;min-height:92px!important;max-height:none!important;margin:0!important;padding:6px!important;display:flex!important;justify-content:flex-start!important;align-items:center!important;overflow-x:auto!important;overflow-y:hidden!important;flex-wrap:nowrap!important;scroll-snap-type:x proximity}.played{width:66px!important;min-width:66px!important;height:94px!important;scroll-snap-align:start}.hand{width:100%!important;height:auto!important;min-height:0!important;max-height:none!important;display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;grid-auto-rows:clamp(142px,45vw,182px)!important;gap:6px!important;overflow:visible!important;padding:0!important}.card{width:100%!important;min-width:0!important;max-width:none!important;height:100%!important;max-height:none!important;aspect-ratio:auto!important;border-radius:11px!important}.card .copy{left:6px!important;right:6px!important;bottom:6px!important}.card .copy b{font-size:11px!important}.card .copy small{font-size:7px!important}.card .copy p{font-size:7.5px!important}.cost{width:22px!important;height:22px!important;font-size:10px!important}.board>div:nth-child(2)>.panel:last-child{display:grid!important;grid-template-rows:auto auto 44px!important;gap:6px!important}.board>div:last-child hr{margin:7px 0!important}#prompt{font-size:15px!important}#log{display:block!important;max-height:120px!important;overflow:auto!important;font-size:9px!important;line-height:1.3!important}#end{height:auto!important;min-height:44px!important;padding:9px!important;font-size:10px!important}.audio{position:fixed!important;top:auto!important;right:62px!important;bottom:calc(10px + env(safe-area-inset-bottom))!important;z-index:75!important}.audio button{padding:7px!important;font-size:9px!important}.wolf{position:fixed!important;right:10px!important;bottom:calc(10px + env(safe-area-inset-bottom))!important;z-index:76!important}.lykos{position:fixed!important;left:8px!important;right:8px!important;bottom:calc(62px + env(safe-area-inset-bottom))!important;width:auto!important;max-width:none!important;z-index:77!important}.box{width:calc(100vw - 16px)!important;max-width:none!important;max-height:calc(var(--sdl-vh) - 16px)!important;padding:12px!important}.grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}.tutorial{padding:8px!important}.tbox{padding:10px!important}
  }
  @media(max-width:480px) and (orientation:portrait){
    .top .actions .btn:not(#home){display:none!important}.hero h1{font-size:clamp(34px,13vw,50px)!important}.cardHero{width:min(210px,58vw)!important}.campaign{padding-inline:6px!important}.mission{min-height:50vh!important}.mcopy b{font-size:23px!important}.art{height:88px!important}.event{grid-template-columns:1fr!important;min-height:0!important}.event img{display:none!important}.event p{font-size:9.5px!important}.hand{grid-auto-rows:clamp(136px,48vw,168px)!important}.card .copy p{display:none!important}.goals{grid-template-columns:1fr 1fr!important}.choice{min-height:44px!important}.s0body{padding-left:4px!important;padding-right:4px!important}.s0card{width:min(43vw,112px)!important;height:min(65vw,168px)!important}
  }
  @media(max-width:920px) and (orientation:landscape){
    html,body{width:100%!important;height:100%!important;overflow:hidden!important}.screen{height:var(--sdl-vh)!important;min-height:0!important;overflow:hidden!important}.top{height:44px!important;min-height:44px!important;padding:4px 8px!important;position:relative!important}.top .brand img{width:28px!important}.top .brand .ey{display:none!important}.top .actions{gap:4px!important}.top .actions .btn{min-height:30px!important;padding:4px 7px!important;font-size:8px!important}.hero{height:var(--sdl-vh)!important;min-height:0!important;grid-template-columns:1.15fr .85fr!important;padding:10px 18px!important;gap:14px!important}.hero h1{font-size:clamp(34px,8vh,52px)!important}.hero .lead{font-size:10px!important;line-height:1.3!important}.cardHero{width:min(190px,28vw,56vh)!important}.campaign{height:calc(var(--sdl-vh) - 44px)!important;min-height:0!important;grid-template-columns:190px minmax(0,1fr)!important;grid-template-rows:1fr!important;margin:0 auto!important;padding:6px!important;gap:6px!important;overflow:hidden!important}.side{padding:8px!important;height:100%!important;overflow:hidden!important}.side h2{font-size:18px!important;margin:2px 0!important}.side .lead{font-size:8.5px!important;line-height:1.25!important}.stat span{padding:3px 5px!important;font-size:8px!important}.campaign>div:last-child{display:grid!important;grid-template-rows:minmax(0,1fr) auto!important;gap:5px!important;overflow:hidden!important}.mission{height:100%!important;min-height:0!important}.mcopy b{font-size:20px!important}.mcopy p{font-size:9px!important;margin:3px 0!important}.next{display:none!important}.campaign .actions{margin:0!important}.campaign .actions .btn{min-height:30px!important;padding:5px!important;font-size:8px!important}
    #game{height:var(--sdl-vh)!important;overflow:hidden!important}#game>.game,.game{height:calc(var(--sdl-vh) - 44px)!important;min-height:0!important;display:grid!important;grid-template-rows:40px minmax(0,1fr)!important;gap:4px!important;padding:4px!important;overflow:hidden!important}.guide{height:40px!important;min-height:40px!important;margin:0!important;padding:4px 7px!important;position:relative!important;top:auto!important}.step{width:30px!important;height:30px!important;flex:0 0 30px!important}.guide b{font-size:11px!important}.guide p{display:none!important}.board{height:100%!important;display:grid!important;grid-template-columns:24% minmax(0,50%) 26%!important;grid-template-rows:1fr!important;gap:4px!important;overflow:hidden!important}.board>div:first-child{grid-column:1!important;grid-row:1!important}.board>div:nth-child(2){grid-column:2!important;grid-row:1!important;display:grid!important;grid-template-rows:29% 19% 52%!important;gap:4px!important;overflow:hidden!important}.board>div:last-child{grid-column:3!important;grid-row:1!important;display:flex!important;overflow:hidden!important}.panel,.board>.panel{padding:5px!important;border-radius:9px!important;height:100%!important;overflow:hidden!important}.art{display:none!important}.panel h3{font-size:11px!important;margin:2px 0!important}.goals{gap:2px!important;margin-top:2px!important}.goal{padding:3px 4px!important;font-size:8px!important}.threat{padding:3px 4px!important;font-size:8px!important;margin-top:3px!important}.event{height:100%!important;min-height:0!important;max-height:none!important;grid-template-columns:64px 1fr!important}.event div{padding:4px!important}.event b{font-size:12px!important}.event p{display:none!important}.play{height:100%!important;min-height:0!important;padding:3px!important;gap:3px!important;overflow:hidden!important;flex-wrap:nowrap!important}.played{width:46px!important;height:64px!important}.played span{font-size:6px!important}.board>div:nth-child(2)>.panel:last-child{display:grid!important;grid-template-rows:10px minmax(0,1fr) 28px!important;gap:3px!important}.hand{height:100%!important;display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;grid-template-rows:repeat(2,minmax(0,1fr))!important;gap:3px!important;overflow:hidden!important;padding:0!important}.card{width:100%!important;min-width:0!important;max-width:none!important;height:100%!important;max-height:none!important;aspect-ratio:auto!important}.card .copy{left:4px!important;right:4px!important;bottom:3px!important}.card .copy b{font-size:7.5px!important}.card .copy small,.card .copy p{display:none!important}.cost{width:17px!important;height:17px!important;font-size:8px!important;top:3px!important;left:3px!important}#end{height:28px!important;min-height:28px!important;padding:3px!important;font-size:8px!important}#prompt{font-size:10px!important;margin:2px 0!important}.choices{gap:3px!important}.choice{min-height:0!important;padding:4px!important;font-size:8px!important}.choice div{font-size:7px!important}#log,.board>div:last-child hr,.board>div:last-child>.ey:last-of-type{display:none!important}.audio{display:none!important}.wolf{width:36px!important;height:36px!important;right:6px!important;bottom:6px!important}.lykos{left:auto!important;right:6px!important;bottom:46px!important;width:min(270px,44vw)!important;padding:6px!important}.lykos img{width:40px!important;height:40px!important}.lykos p{font-size:8px!important}.box{max-height:94vh!important;padding:8px!important}.grid{grid-template-columns:repeat(4,minmax(0,1fr))!important}
    #stage0 .s0{height:var(--sdl-vh)!important;grid-template-rows:40px minmax(0,1fr)!important}#stage0 .s0body{grid-template-columns:135px minmax(0,1fr)!important;grid-template-rows:1fr!important;padding:4px!important;gap:4px!important}#stage0 .s0body>.s0p:last-child{display:none!important}#stage0 .s0lyk{display:block!important;padding:5px!important}#stage0 .s0lyk img{width:100%!important;height:88px!important}#stage0 .s0lyk h2{display:block!important;font-size:16px!important;margin:3px 0!important}#stage0 .s0say{font-size:8px!important;line-height:1.2!important;padding:4px!important}#stage0 .s0mid{grid-template-rows:minmax(0,1fr) 34px!important}#stage0 .s0mid>.s0p:first-child{display:none!important}#stage0 .s0arena{padding:4px!important}#stage0 .s0q h3{font-size:14px!important}#stage0 .s0ans{grid-template-columns:1fr 1fr!important;gap:4px!important}#stage0 .s0ans button{min-height:34px!important;padding:4px!important;font-size:8px!important}#stage0 .s0card{width:92px!important;height:130px!important}#stage0 .s0foot{padding:3px!important}#stage0 .s0end{min-height:28px!important;padding:3px 6px!important;font-size:8px!important}
  }
  `;
'''
              needle = "  const stageCss=`"
              if needle not in s:
                  raise SystemExit('No se encontró stageCss')
              s = s.replace(needle, responsive + needle, 1)
              old = "html=html.replace('</head>','<style id=\"sdl-stage-zero-self-contained\">'+stageCss+'</style></head>');"
              new = "html=html.replace('</head>','<style id=\"sdl-responsive-auto-v2\">'+responsiveCss+'</style><style id=\"sdl-stage-zero-self-contained\">'+stageCss+'</style></head>');"
              if old not in s:
                  raise SystemExit('No se encontró el punto de inyección CSS')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit responsive patch
        shell: bash
        run: |
          git config user.name "sangre-de-luna-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-time-mobile-responsive-game.yml
          git add game-runtime/live-loader.js
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Make game automatically responsive on mobile screens"
          git push origin HEAD:main
