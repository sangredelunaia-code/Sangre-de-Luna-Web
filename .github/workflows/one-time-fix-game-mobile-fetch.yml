name: One-time fix game mobile fetch

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/one-time-fix-game-mobile-fetch.yml"

permissions:
  contents: write

env:
  VERCEL_ORG_ID: team_USwuTxCjOXo8HKndCZqkUn24
  VERCEL_PROJECT_ID: prj_VXEIZvn8s0qq57aAbPS7UnR1DrzG

jobs:
  deploy-game:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Vercel credential
        id: auth
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not configured."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build self-contained production game
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('game-runtime/v2')
          parts = [root / f'part{i}.txt' for i in range(5)]
          missing = [str(p) for p in parts if not p.exists()]
          if missing:
              raise SystemExit('Missing runtime parts: ' + ', '.join(missing))

          html = ''.join(p.read_text(encoding='utf-8') for p in parts)
          required = ['Crónicas de la Ciudadela', 'Lykos', 'wolf-entry.mp3', 'const events=[', 'const names=']
          for marker in required:
              if marker not in html:
                  raise SystemExit(f'Runtime marker not found: {marker}')

          # Preserve the current Interrogantes content without any client-side loader.
          question_events = r'''const events=[
          ['Banderas falsas','tour-360-murallas.webp','Un guardia lleva una insignia que no coincide con el registro. ¿Qué comprobarás primero?',[['Examinar el sello y la insignia',{i:2}],['Calmar a los presentes y contener rumores',{l:2}]]],
          ['Ruta alterada','mapa-tierras-sangre-de-luna.webp','Dos señales indican rutas distintas. ¿Cómo determinarás cuál es la auténtica?',[['Comparar el mapa con los registros',{s:2}],['Seguir las huellas recientes',{i:2}]]],
          ['Mensaje interceptado','tour-360-archivo-nine.webp','Un informe clave nunca llegó a su destino. ¿Cuál será tu primera acción?',[['Rastrear el origen del mensaje',{i:2}],['Restablecer el canal seguro',{l:1,s:1}]]],
          ['Niebla del valle','tour-360-torre.webp','La niebla cubre las rutas y varias patrullas pierden visibilidad. ¿Qué priorizarás?',[['Reforzar los puestos de vigilancia',{d:2}],['Coordinar señales desde la torre',{s:2}]]],
          ['Consejo urgente','tour-360-salon-trono.webp','La Corte exige una recomendación inmediata. ¿Qué presentarás primero?',[['Evidencia verificada',{i:1,l:1}],['Un plan táctico de respuesta',{s:2}]]],
          ['Testimonio contradictorio','tour-360-patio.webp','Dos testigos describen el mismo hecho de manera diferente. ¿Cómo aclararás la verdad?',[['Comparar ambos testimonios',{i:2}],['Reunirlos y buscar un punto en común',{l:2}]]],
          ['Baliza apagada','tour-360-murallas.webp','Una baliza deja de responder justo antes del cambio de guardia. ¿Qué revisarás?',[['La secuencia de activación',{s:2}],['Las marcas alrededor del mecanismo',{i:2}]]],
          ['Puerta sin registro','tour-360-puertas.webp','La puerta norte fue abierta, pero no existe registro oficial. ¿Qué harás?',[['Revisar quién tenía autorización',{i:2}],['Asegurar primero el acceso',{d:2}]]],
          ['Rumor en el patio','tour-360-patio.webp','Un rumor acusa a un aliado sin pruebas. ¿Cómo evitarás que la tensión crezca?',[['Pedir pruebas antes de aceptar la acusación',{i:1,l:1}],['Emitir una versión oficial y calmada',{l:2}]]],
          ['Suministros desviados','tour-360-puertas.webp','Un cargamento llegó a una zona distinta de la indicada. ¿Cuál es tu prioridad?',[['Verificar la ruta escrita en los registros',{i:2}],['Proteger el cargamento mientras investigas',{d:2}]]],
          ['Puente del Este','tour-vampiro-puente.webp','Una señal del puente del Este no coincide con el protocolo acordado. ¿Cómo procederás?',[['Consultar el acuerdo con los aliados',{l:1,s:1}],['Comparar la señal con el patrón original',{i:2}]]],
          ['Archivo incompleto','tour-360-archivo-nine.webp','Falta una página en un expediente reciente. ¿Qué pista buscarás primero?',[['Quién consultó el archivo por última vez',{i:2}],['Qué decisión dependía de esa página',{s:2}]]]
          ].map(x=>({n:x[0],img:x[1],t:x[2],ch:x[3]}));'''
          qs = html.find('const events=[')
          qe = html.find('const names=', qs)
          if qs < 0 or qe <= qs:
              raise SystemExit('Could not locate event block')
          html = html[:qs] + question_events + '\n' + html[qe:]

          replacements = {
              '<small>EVENTO</small>': '<small>INTERROGANTE</small>',
              '¿Cómo responderás al evento?': '¿Cuál es tu respuesta?',
              'responde al evento': 'responde al interrogante',
              'Responde al evento': 'Responde al interrogante',
              'Nueva ronda. Primero responde al evento.': 'Nueva ronda. Primero responde al interrogante.',
              'Cada ronda empieza con un evento.': 'Cada ronda empieza con un interrogante.',
              '1. Responde al evento.': '1. Responde al interrogante.',
              "u.lang='es-ES';u.rate=.95;u.pitch=.86": "u.lang='es-MX';u.rate=.90;u.pitch=.72",
              'width=device-width,initial-scale=1': 'width=device-width,initial-scale=1,viewport-fit=cover'
          }
          for old, new in replacements.items():
              html = html.replace(old, new)

          stage_css = r'''
          /* sdl-self-contained-v1: Etapa CERO sin dependencias entre deployments */
          #stage0{background:linear-gradient(#02050ad9,#02050af5),url('https://cdn.jsdelivr.net/gh/sangredelunaia-code/Sangre-de-Luna-Web@main/assets/tour-360-patio.webp') center/cover}
          .s0{height:100dvh;display:grid;grid-template-rows:52px minmax(0,1fr);overflow:hidden}.s0top{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:#05090ef2;border-bottom:1px solid #bddbef2c;gap:10px}.s0body{display:grid;grid-template-columns:220px minmax(0,1fr) 250px;gap:8px;padding:8px;min-height:0}.s0p{background:#0b1420e8;border:1px solid #bddbef2c;border-radius:14px;padding:10px;overflow:hidden}.s0lyk img{width:100%;height:165px;object-fit:cover;border-radius:10px}.s0lyk h2{font:600 23px Georgia;color:#ffe9b5;margin:7px 0}.s0say{font-size:11px;line-height:1.45;padding:9px;background:#ffffff08;border-left:3px solid #d7b66f;border-radius:9px}.s0mid{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:7px;min-height:0}.s0arena{display:grid;place-items:center;min-height:0}.s0q{width:min(650px,95%)}.s0q h3{font:600 22px Georgia;margin:5px 0}.s0ans{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.s0ans button,.s0end,.s0go{border:1px solid #d7b66f66;background:#132130;color:#eef7ff;border-radius:10px;padding:9px;font-weight:800;cursor:pointer}.s0end,.s0go{background:linear-gradient(#dec48e,#957044);color:#111}.s0end:disabled{opacity:.3}.s0cards{display:flex;gap:12px;justify-content:center;align-items:center}.s0card{position:relative;width:145px;height:225px;border:2px solid #637c8b;border-radius:14px;overflow:hidden;background:#071019;cursor:pointer}.s0card img{width:100%;height:100%;object-fit:cover}.s0card:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 45%,#02060bef 84%)}.s0c{position:absolute;z-index:2;left:8px;right:8px;bottom:8px}.s0c b{display:block;font:600 16px Georgia}.s0active{border-color:#d7b66f;box-shadow:0 0 0 4px #d7b66f22}.s0lock{opacity:.3}.s0used{opacity:.55}.s0foot{display:flex;justify-content:space-between;align-items:center;gap:8px}.s0res{font-size:10px;display:flex;gap:5px;flex-wrap:wrap}.s0res span{padding:5px 7px;background:#ffffff08;border-radius:8px}.s0now{padding:9px;background:#162431;border:1px solid #d7b66f55;border-radius:10px}.s0now b{font:600 16px Georgia}.s0dots{display:flex;gap:4px}.s0dots i{width:23px;height:6px;background:#ffffff18;border-radius:999px}.s0dots i.on{background:#d7b66f}.s0done{text-align:center}.s0done img{width:90px;height:90px;object-fit:cover;border-radius:18px}.s0done h2{font:600 28px Georgia;margin:8px 0}
          @media(max-width:820px){.s0{grid-template-rows:46px minmax(0,1fr)}.s0top{padding:5px 8px}.s0top .ey{font-size:8px}.s0top b{font-size:11px}.s0dots i{width:17px}.s0body{grid-template-columns:1fr;grid-template-rows:64px minmax(0,1fr);gap:5px;padding:5px}.s0body>.s0p:last-child{display:none}.s0lyk{display:grid;grid-template-columns:52px minmax(0,1fr);grid-template-rows:18px 1fr;gap:2px 8px;padding:5px 7px}.s0lyk img{width:52px;height:52px;grid-row:1/3;border-radius:9px}.s0lyk .ey{font-size:7px}.s0lyk h2{font-size:15px;margin:0;display:none}.s0say{grid-column:2;font-size:9px;line-height:1.25;padding:5px 7px;overflow:hidden}.s0mid{grid-template-rows:minmax(0,1fr) 42px;gap:5px}.s0mid>.s0p:first-child{display:none}.s0arena{padding:6px}.s0q{width:100%}.s0q h3{font-size:17px;line-height:1.15}.s0q p{font-size:10px}.s0ans{grid-template-columns:1fr;gap:5px;margin-top:7px}.s0ans button{padding:7px;font-size:10px}.s0cards{gap:7px}.s0card{width:min(31vw,116px);height:min(45vw,174px)}.s0c{left:6px;right:6px;bottom:5px}.s0c b{font-size:11px}.s0c p,.s0c small{font-size:8px}.s0foot{padding:5px}.s0res{font-size:8px;gap:3px}.s0res span{padding:3px 5px}.s0end{padding:6px 8px;font-size:9px}.s0done img{width:64px;height:64px}.s0done h2{font-size:20px}.s0done p{font-size:10px;margin:5px 0}.s0go{padding:8px;font-size:10px}}
          @media(max-width:420px){.s0top b{font-size:10px}.s0dots i{width:13px}.s0q h3{font-size:15px}.s0card{width:105px;height:158px}.s0say{font-size:8px}.s0res span:nth-child(n+4){display:none}}
          '''

          stage_js = r'''
          (()=>{
            const S0A='https://cdn.jsdelivr.net/gh/sangredelunaia-code/Sangre-de-Luna-Web@main/assets/';
            let s0Step=0,s0Res={i:0,l:0,s:0,d:0};
            const E=id=>document.getElementById(id);
            function s0Speak(text){
              try{
                if(!('speechSynthesis' in window)||!text)return;
                speechSynthesis.cancel();
                const u=new SpeechSynthesisUtterance(text);
                const voices=speechSynthesis.getVoices()||[];
                const es=voices.filter(v=>/^es([-_]|$)/i.test(v.lang||''));
                const male=/jorge|diego|pablo|carlos|miguel|juan|andres|andrés|raul|raúl|alvaro|álvaro|male|hombre/i;
                const v=es.find(x=>male.test(x.name||''))||es.find(x=>/^es-(MX|US|419)/i.test(x.lang||''))||es[0];
                if(v){u.voice=v;u.lang=v.lang}else u.lang='es-MX';
                u.rate=.90;u.pitch=.72;u.volume=1;speechSynthesis.speak(u);
              }catch(e){}
            }
            function s0Say(text){const el=E('zs');if(el)el.textContent=text;s0Speak(text)}
            function s0Ensure(){
              if(E('stage0'))return;
              const sec=document.createElement('section');sec.id='stage0';sec.className='screen';
              sec.innerHTML='<div class="s0"><div class="s0top"><div><div class="ey">ENTRENAMIENTO OBLIGATORIO</div><b>ETAPA CERO · EL PRIMER RASTRO</b></div><div class="s0dots" id="zd"></div></div><div class="s0body"><aside class="s0p s0lyk"><img src="'+S0A+'lykos-guardian-approved.webp" alt="Lykos"><div class="ey">GUARDIÁN · GUÍA</div><h2>Lykos</h2><div class="s0say" id="zs"></div></aside><main class="s0mid"><div class="s0p"><div class="ey">OPERACIÓN DE ENTRENAMIENTO</div><b>Aprende una ronda completa antes de entrar en campaña.</b></div><div class="s0p s0arena" id="za"></div><div class="s0p s0foot"><div class="s0res" id="zr"></div><button class="s0end" id="ze" disabled>TERMINAR RONDA</button></div></main><aside class="s0p"><div class="ey">AHORA HAZ ESTO</div><div class="s0now" id="zn"></div><p style="font-size:10px;color:#9fb0ba;line-height:1.5">1. Responde el interrogante<br>2. Juega a Kai<br>3. Combina Mapa de Rutas<br>4. Termina la ronda</p></aside></div></div>';
              document.body.appendChild(sec);
              E('ze').onclick=()=>{if(s0Step===4)s0Finish()};
            }
            function s0Screen(){try{scr('stage0')}catch(e){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));E('stage0').classList.add('on')}}
            function s0Progress(){if(E('zd'))E('zd').innerHTML=[1,2,3,4].map(n=>'<i class="'+(s0Step>=n?'on':'')+'"></i>').join('');if(E('zr'))E('zr').innerHTML='<span>🔎 '+s0Res.i+'</span><span>🤝 '+s0Res.l+'</span><span>♟ '+s0Res.s+'</span><span>🛡 '+s0Res.d+'</span>'}
            function s0Now(n,t,x){if(E('zn'))E('zn').innerHTML='<b>'+n+' · '+t+'</b><p style="font-size:11px;color:#c4d0d7">'+x+'</p>'}
            function s0Start(){s0Ensure();s0Step=0;s0Res={i:0,l:0,s:0,d:0};s0Screen();s0Progress();s0Now('0','Escucha a Lykos','Pulsa comenzar entrenamiento.');E('ze').disabled=true;E('za').innerHTML='<div class="s0done"><img src="'+S0A+'lykos-guardian-approved.webp" alt="Lykos"><div class="ey">ETAPA CERO</div><h2>Antes de entrar a la Ciudadela</h2><p>Lykos te enseñará jugando. Sigue únicamente lo que te indique.</p><button class="s0go" id="zb">COMENZAR ENTRENAMIENTO</button></div>';E('zb').onclick=s0One;s0Say('Bienvenido a la Ciudadela. Soy Lykos. Antes de comenzar tu campaña, aprenderás conmigo una ronda completa. Sigue únicamente lo que te indique.')}
            function s0One(){s0Step=1;s0Progress();s0Now('1','Responde el interrogante','Elige una decisión. Cada respuesta fortalece recursos diferentes.');E('za').innerHTML='<div class="s0q"><div class="ey">INTERROGANTE DE ENTRENAMIENTO</div><h3>Una señal de la puerta no coincide con el registro. ¿Qué harás primero?</h3><div class="s0ans"><button data-s0a="i">Comparar con el registro<br><small>🔎 +2 Información</small></button><button data-s0a="l">Avisar a la Guardia<br><small>🤝 +2 Lealtad</small></button></div></div>';document.querySelectorAll('[data-s0a]').forEach(b=>b.onclick=()=>{b.dataset.s0a==='i'?s0Res.i+=2:s0Res.l+=2;s0Progress();s0Two()});s0Say('Primer paso. Cada ronda comienza con un interrogante. Elige cómo responder. No siempre hay una sola respuesta correcta.')}
            function s0Two(){s0Step=2;s0Progress();s0Now('2','Juega a Kai Voss','La carta iluminada es la que debes usar ahora.');E('za').innerHTML='<div class="s0cards"><div class="s0card s0active" id="zk"><img src="'+S0A+'kai.webp" alt="Kai Voss"><div class="s0c"><small>PERSONAJE</small><b>Kai Voss</b><p>🔎 +2 · ♟ +1</p></div></div><div class="s0card s0lock"><img src="'+S0A+'mapa-tierras-sangre-de-luna.webp" alt="Mapa de Rutas"><div class="s0c"><b>Mapa de Rutas</b></div></div></div>';E('zk').onclick=()=>{s0Res.i+=2;s0Res.s++;s0Progress();s0Three()};s0Say('Ahora juega a Kai Voss. Los personajes aportan recursos. Kai aumenta Información y Estrategia.')}
            function s0Three(){s0Step=3;s0Progress();s0Now('3','Combina una carta de apoyo','Juega Mapa de Rutas para complementar a Kai.');E('za').innerHTML='<div class="s0cards"><div class="s0card s0used"><img src="'+S0A+'kai.webp" alt="Kai Voss"><div class="s0c"><b>Kai Voss</b><p>Ya fue jugado</p></div></div><div class="s0card s0active" id="zm"><img src="'+S0A+'mapa-tierras-sangre-de-luna.webp" alt="Mapa de Rutas"><div class="s0c"><small>APOYO</small><b>Mapa de Rutas</b><p>🔎 +1 · ♟ +1</p></div></div></div>';E('zm').onclick=()=>{s0Res.i++;s0Res.s++;s0Progress();s0Four()};s0Say('Combina a Kai con Mapa de Rutas. Las cartas de apoyo complementan a tus personajes y aceleran tus objetivos.')}
            function s0Four(){s0Step=4;s0Progress();s0Now('4','Termina la ronda','Ya decidiste y jugaste tus cartas. Ahora cierra la ronda.');E('za').innerHTML='<div class="s0q"><div class="ey">RONDA LISTA</div><h3>Has completado la secuencia básica.</h3><p>En las misiones repetirás este ciclo hasta alcanzar los objetivos sin dejar que la amenaza crezca demasiado.</p></div>';E('ze').disabled=false;s0Say('Perfecto. Pulsa Terminar Ronda. Con eso completarás tu entrenamiento.')}
            function s0Finish(){s0Step=5;E('ze').disabled=true;try{sv.tut=true;save()}catch(e){}localStorage.setItem('sdl_stage0_v1','done');E('za').innerHTML='<div class="s0done"><img src="'+S0A+'lykos-guardian-approved.webp" alt="Lykos"><div class="ey">ENTRENAMIENTO COMPLETADO</div><h2>La Ciudadela te espera</h2><p>Ya sabes responder interrogantes, jugar personajes, combinar apoyos y cerrar rondas.</p><button class="s0go" id="zc">ENTRAR A LA MISIÓN 1</button></div>';s0Now('✓','Etapa CERO completada','La Misión 1 está desbloqueada.');E('zc').onclick=s0Campaign;s0Say('Entrenamiento completado. Ya estás listo. La primera misión ha sido desbloqueada. Yo seguiré cerca si necesitas orientación.')}
            function s0Campaign(){try{if(typeof campaign==='function'){campaign();return}}catch(e){}try{scr('campaign')}catch(e){}}
            window.stageZeroStart=s0Start;
            try{training=s0Start}catch(e){}
            const nb=E('new');if(nb)nb.onclick=()=>{try{sv={u:1,done:{},st:0,cmd:0,tut:false};save()}catch(e){}localStorage.removeItem('sdl_stage0_v1');s0Start()};
            const cb=E('cont');if(cb)cb.onclick=()=>{let done=localStorage.getItem('sdl_stage0_v1')==='done';try{done=done||!!sv.tut}catch(e){}done?s0Campaign():s0Start()};
          })();
          '''

          if '</head>' not in html or '</body>' not in html:
              raise SystemExit('Runtime HTML is incomplete')
          html = html.replace('</head>', '<style id="sdl-stage-zero-self-contained">' + stage_css + '</style></head>', 1)
          html = html.replace('</body>', '<script id="sdl-stage-zero-self-contained-js">' + stage_js + '</script></body>', 1)

          if 'sangre-de-luna-ecos-ciudadela-rla5schlt.vercel.app' in html:
              raise SystemExit('Protected deployment dependency is still present')
          if 'sdl-self-contained-v1' not in html or 'stageZeroStart' not in html:
              raise SystemExit('Stage CERO injection failed')

          out = Path('game-dist')
          out.mkdir(exist_ok=True)
          (out / 'index.html').write_text(html, encoding='utf-8')
          (out / 'vercel.json').write_text('{"headers":[{"source":"/(.*)","headers":[{"key":"Cache-Control","value":"public, max-age=0, must-revalidate"}]}]}', encoding='utf-8')
          print('Built self-contained game:', (out / 'index.html').stat().st_size, 'bytes')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pull game project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          cd game-dist
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy self-contained game to production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          cd game-dist
          DEPLOY_URL=$(npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN" | tail -n 1)
          echo "Deployment: $DEPLOY_URL"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Verify public game alias
        shell: bash
        run: |
          url="https://sangre-de-luna-ecos-ciudadela.vercel.app/"
          ok=0
          for i in $(seq 1 15); do
            echo "Verification attempt $i..."
            if curl -fsSL --max-time 20 "$url" -o /tmp/game.html; then
              if grep -q 'sdl-stage-zero-self-contained' /tmp/game.html && ! grep -q 'sangre-de-luna-ecos-ciudadela-rla5schlt' /tmp/game.html; then
                ok=1
                break
              fi
            fi
            sleep 4
          done
          if [ "$ok" -ne 1 ]; then
            echo "The public alias did not serve the self-contained build in time."
            exit 1
          fi
          echo "Public game verified without protected cross-deployment fetch."

      - name: Remove one-time workflow
        shell: bash
        run: |
          git config user.name "sangre-de-luna-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-time-fix-game-mobile-fetch.yml
          git commit -m "Remove one-time game mobile fetch fix workflow"
          git push origin HEAD:main
