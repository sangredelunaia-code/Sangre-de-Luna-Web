name: Android · Crónicas de la Ciudadela

on:
  push:
    branches: [android-cronicas]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-cronicas.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK and AAB
        run: gradle assembleDebug bundleDebug --stacktrace

      - name: Rename outputs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Sangre-de-Luna-Cronicas.apk
          cp app/build/outputs/bundle/debug/app-debug.aab Sangre-de-Luna-Cronicas.aab

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sangre-de-Luna-Cronicas-Android
          path: |
            android-app/Sangre-de-Luna-Cronicas.apk
            android-app/Sangre-de-Luna-Cronicas.aab

      - name: Publish downloadable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-cronicas-latest >/dev/null 2>&1; then
            gh release upload android-cronicas-latest Sangre-de-Luna-Cronicas.apk Sangre-de-Luna-Cronicas.aab --clobber
          else
            gh release create android-cronicas-latest Sangre-de-Luna-Cronicas.apk Sangre-de-Luna-Cronicas.aab \
              --target "$GITHUB_SHA" \
              --title "Sangre de Luna · Crónicas — Android" \
              --notes "APK instalable y AAB de prueba generados automáticamente desde la rama Android. El sitio web principal no fue modificado." \
              --prerelease
          fi
