name: Enable global ambient music

on:
  push:
    branches:
      - feature/global-ambient-music
    paths:
      - ambient-global.js

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/global-ambient-music
          fetch-depth: 0

      - name: Wire global ambient player
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          cronista = Path('cronista-global.js')
          text = cronista.read_text(encoding='utf-8')
          if '/ambient-global.js' not in text:
              text += '''\n\n/* SANGRE DE LUNA · MÚSICA AMBIENTAL GLOBAL */\n(()=>{\n  if(document.getElementById('sdlAmbientGlobalLoader')) return;\n  const s=document.createElement('script');\n  s.id='sdlAmbientGlobalLoader';\n  s.src='/ambient-global.js';\n  s.defer=true;\n  document.head.appendChild(s);\n})();\n'''
              cronista.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          old = "function configureAmbient(){const a=cache.ambient,enabled=!!a?.is_active&&!!a.audio_url;ambientToggle.hidden=!enabled;if(!enabled){ambientAudio.pause();return}if(ambientAudio.src!==new URL(a.audio_url,location.href).href)ambientAudio.src=a.audio_url;ambientAudio.volume=Math.min(.6,Math.max(.05,Number(a.volume)||.22));ambientAudio.muted=ambientMuted();updateAmbientButton();if(sessionStorage.getItem('sdl-entered')&&!ambientMuted())ambientAudio.play().catch(()=>{})}"
          new = "function configureAmbient(){const a=cache.ambient,enabled=!!a?.is_active&&!!a.audio_url;ambientToggle.hidden=!enabled;if(!enabled){ambientAudio.pause();return}const nextSrc=new URL(a.audio_url,location.href).href;if(ambientAudio.src!==nextSrc)ambientAudio.src=a.audio_url;ambientAudio.volume=Math.min(.6,Math.max(.05,Number(a.volume)||.22));ambientAudio.muted=ambientMuted();updateAmbientButton();const savedSrc=sessionStorage.getItem('sdl-ambient-source-v1'),savedPos=Number(sessionStorage.getItem('sdl-ambient-position-v1'));if(savedSrc===nextSrc&&Number.isFinite(savedPos)&&savedPos>0){const restore=()=>{try{if(Math.abs(ambientAudio.currentTime-savedPos)>1)ambientAudio.currentTime=savedPos}catch{}};if(ambientAudio.readyState>=1)restore();else ambientAudio.addEventListener('loadedmetadata',restore,{once:true})}if(sessionStorage.getItem('sdl-entered')&&!ambientMuted())ambientAudio.play().catch(()=>{})}"
          if old in html:
              html = html.replace(old, new, 1)

          old2 = "ambientToggle.onclick=()=>{const muted=!ambientMuted();localStorage.setItem('sdl-ambient-muted',muted?'1':'0');ambientAudio.muted=muted;updateAmbientButton();if(muted)ambientAudio.pause();else startAmbient()};"
          new2 = old2 + "\nlet ambientSaveAt=0;function saveAmbientPosition(){try{if(ambientAudio.src&&Number.isFinite(ambientAudio.currentTime)){sessionStorage.setItem('sdl-ambient-position-v1',String(ambientAudio.currentTime));sessionStorage.setItem('sdl-ambient-source-v1',ambientAudio.currentSrc||ambientAudio.src)}}catch{}}ambientAudio.addEventListener('timeupdate',()=>{if(Date.now()-ambientSaveAt>900){ambientSaveAt=Date.now();saveAmbientPosition()}});addEventListener('pagehide',saveAmbientPosition);"
          if old2 in html and 'function saveAmbientPosition()' not in html:
              html = html.replace(old2, new2, 1)

          index.write_text(html, encoding='utf-8')
          PY

      - name: Commit wiring
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "sangre-de-luna-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cronista-global.js index.html
          git commit -m "Conectar música ambiental global"
          git push origin HEAD:feature/global-ambient-music
