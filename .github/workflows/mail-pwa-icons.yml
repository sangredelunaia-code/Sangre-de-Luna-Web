name: Prepare Sangre de Luna Mail PWA icons
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mail-pwa-icons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow==11.3.0'
      - name: Render icons from the official logo
        run: python scripts/make_mail_pwa_icons.py
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sdl-mail-192.png assets/sdl-mail-512.png assets/sdl-mail-maskable-512.png
          if ! git diff --staged --quiet; then
            git commit -m "assets: generate official Webmail PWA icons"
            git push origin HEAD:main
          fi
