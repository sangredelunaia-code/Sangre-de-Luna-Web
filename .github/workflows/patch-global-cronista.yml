name: Integrar Cronista global

on:
  push:
    branches:
      - feature/global-cronista

permissions:
  contents: write

jobs:
  patch-pages:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/global-cronista
          fetch-depth: 0
      - name: Insertar Cronista en páginas independientes
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = ['fanclub.html', 'mapa.html', 'tour.html', 'viaje.html']
          marker = '<script src="/cronista-global.js" defer></script>'
          for name in pages:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if marker in text:
                  print(name, 'ya integrado')
                  continue
              if '</body>' in text:
                  text = text.replace('</body>', marker + '\n</body>', 1)
              elif '</html>' in text:
                  text = text.replace('</html>', marker + '\n</html>', 1)
              else:
                  text += '\n' + marker + '\n'
              p.write_text(text, encoding='utf-8')
              print(name, 'actualizado')
          PY
      - name: Guardar cambios
        run: |
          if git diff --quiet; then
            echo "Sin cambios pendientes"
            exit 0
          fi
          git config user.name "sangre-de-luna-bot"
          git config user.email "actions@users.noreply.github.com"
          git add fanclub.html mapa.html tour.html viaje.html
          git commit -m "Integrar Cronista en todas las páginas"
          git push origin HEAD:feature/global-cronista
