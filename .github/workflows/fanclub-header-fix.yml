name: Fan Club navigation repair

on:
  push:
    paths:
      - '.github/workflows/fanclub-header-fix.yml'

permissions:
  contents: write

jobs:
  patch-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair Fan Club return link and HTML headers
        shell: python
        run: |
          from pathlib import Path
          import json

          fanclub = Path('fanclub.html')
          text = fanclub.read_text(encoding='utf-8')
          old = '<a class="btn ghost back" href="/index.html">↩ VOLVER AL SITIO</a>'
          new = '<a class="btn ghost back" href="/">↩ VOLVER AL SITIO</a>'
          if old in text:
              text = text.replace(old, new, 1)
              fanclub.write_text(text, encoding='utf-8')
              print('Fan Club return link repaired to root route.')
          elif new in text:
              print('Fan Club return link already points to root route.')
          else:
              raise SystemExit('Fan Club return marker not found')

          config_path = Path('vercel.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          headers = config.setdefault('headers', [])

          def ensure_html_header(source):
              rule = next((r for r in headers if r.get('source') == source), None)
              if rule is None:
                  rule = {'source': source, 'headers': []}
                  headers.append(rule)
              pairs = rule.setdefault('headers', [])
              values = {h.get('key','').lower(): h for h in pairs}
              if 'content-type' in values:
                  values['content-type']['value'] = 'text/html; charset=utf-8'
              else:
                  pairs.append({'key': 'Content-Type', 'value': 'text/html; charset=utf-8'})
              if 'cache-control' in values:
                  values['cache-control']['value'] = 'no-store, no-cache, must-revalidate'
              else:
                  pairs.append({'key': 'Cache-Control', 'value': 'no-store, no-cache, must-revalidate'})

          ensure_html_header('/')
          ensure_html_header('/index.html')
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('Vercel HTML headers ensured.')

      - name: Commit repair
        run: |
          if git diff --quiet -- fanclub.html vercel.json; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "sangredelunaia-code"
          git config user.email "sangredelunaia@gmail.com"
          git add fanclub.html vercel.json
          git commit -m "Fix Fan Club return to root site"
          git push
