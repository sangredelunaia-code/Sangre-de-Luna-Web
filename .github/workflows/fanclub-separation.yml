name: Fan Club separation repair

on:
  push:
    branches:
      - feature/separate-fanclub-access
    paths:
      - '.github/workflows/fanclub-separation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/separate-fanclub-access
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Separate access and private member area
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          fan = Path('fanclub.html')
          text = fan.read_text(encoding='utf-8')
          marker = '<script src="/desafios.js" defer></script>'
          router = '<script src="/fanclub-separation.js" defer></script>'
          if router not in text:
              if marker not in text:
                  raise SystemExit('No se encontró el cargador de desafios.js')
              text = text.replace(marker, marker + '\n' + router, 1)
              fan.write_text(text, encoding='utf-8')

          vf = Path('vercel.json')
          cfg = json.loads(vf.read_text(encoding='utf-8'))
          rewrites = cfg.setdefault('rewrites', [])
          wanted = [
              {'source':'/la-manada','destination':'/fanclub.html'},
              {'source':'/la-manada.html','destination':'/fanclub.html'},
          ]
          existing = {(r.get('source'), r.get('destination')) for r in rewrites}
          for item in reversed(wanted):
              if (item['source'], item['destination']) not in existing:
                  rewrites.insert(0, item)

          headers = cfg.setdefault('headers', [])
          if not any(h.get('source') == '/la-manada' for h in headers):
              headers.append({
                  'source':'/la-manada',
                  'headers':[
                      {'key':'Cache-Control','value':'no-store, no-cache, must-revalidate'},
                      {'key':'X-Robots-Tag','value':'noindex, nofollow, nosnippet'},
                  ],
              })
          if not any(h.get('source') == '/fanclub-separation.js' for h in headers):
              headers.append({
                  'source':'/fanclub-separation.js',
                  'headers':[
                      {'key':'Cache-Control','value':'no-store, no-cache, must-revalidate'},
                      {'key':'X-Robots-Tag','value':'noindex, nofollow, nosnippet'},
                  ],
              })
          vf.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit generated wiring
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'sangre-de-luna-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add fanclub.html vercel.json
          git commit -m 'feat: wire Fan Club access and La Manada route'
          git push origin HEAD:feature/separate-fanclub-access
